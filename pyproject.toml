[project]
name = "wallkeep"
version = "0.1.0"
description = "Native wallpaper library for local collections and X media"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.0",
    "gallery-dl>=1.27",
    "numpy>=2.4.6",
]

[project.scripts]
wallkeep = "wallkeep.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wallkeep"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I"]

[[tool.uv.index]]
name = "ustc"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true
